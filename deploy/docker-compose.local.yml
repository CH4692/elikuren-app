# Lokal testen (ohne TLS, nur HTTP)
# Start: docker compose -f docker-compose.local.yml --env-file .env.local up -d
# Vorher: .env.local anlegen (siehe .env.example) und ggf. /etc/hosts eintragen

services:
  traefik:
    image: traefik:v3.6.8
    container_name: traefik-local
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-local.yml:/etc/traefik/traefik.yml:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.traefik-local.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)
      - traefik.http.routers.traefik-local.entrypoints=web
      - traefik.http.routers.traefik-local.service=api@internal

  web:
    build:
      context: ../app-elikuren-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/profile}
        - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/profile}
        - NEXT_PUBLIC_CLERK_PROXY_URL=${NEXT_PUBLIC_CLERK_PROXY_URL:-}
    image: elikuren-web:local
    container_name: elikuren-web-local
    restart: unless-stopped
    env_file:
      - .env.local
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.web-local.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.web-local.entrypoints=web
      - traefik.http.services.web-local.loadbalancer.server.port=3000

  api:
    build:
      context: ../app-elikuren-api
      dockerfile: Dockerfile
    image: elikuren-api:local
    container_name: elikuren-api-local
    restart: unless-stopped
    env_file:
      - .env.local
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.api-local.rule=Host(`${API_HOST}`)
      - traefik.http.routers.api-local.entrypoints=web
      - traefik.http.services.api-local.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
