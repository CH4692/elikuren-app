services:
  web:
    image: ${WEB_IMAGE}
    container_name: elikuren-web-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.web-dev.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.web-dev.entrypoints=websecure
      - traefik.http.routers.web-dev.tls=true
      - traefik.http.routers.web-dev.tls.certresolver=le
      - traefik.http.services.web-dev.loadbalancer.server.port=3000

  api:
    image: ${API_IMAGE}
    container_name: elikuren-api-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.api-dev.rule=Host(`${API_HOST}`)
      - traefik.http.routers.api-dev.entrypoints=websecure
      - traefik.http.routers.api-dev.tls=true
      - traefik.http.routers.api-dev.tls.certresolver=le
      - traefik.http.services.api-dev.loadbalancer.server.port=8000

networks:
  proxy:
    name: proxy
