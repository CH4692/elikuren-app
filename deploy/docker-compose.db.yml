services:
  db:
    image: postgres:16
    container_name: elikuren-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: elikuren
      POSTGRES_USER: elikuren
      POSTGRES_PASSWORD: elikuren
    ports:
      - "5432:5432"
    volumes:
      - postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elikuren -d elikuren"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-local:
