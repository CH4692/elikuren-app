# Production – Traefik + Web + API
# Start: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Runtime config + image tags come from .env.prod

services:
  traefik:
    image: traefik:v3.6.8
    container_name: traefik-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik-users:/etc/traefik/traefik-users:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.traefik-prod.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)
      - traefik.http.routers.traefik-prod.entrypoints=websecure
      - traefik.http.routers.traefik-prod.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.usersfile=/etc/traefik/traefik-users
      - traefik.http.routers.traefik-prod.tls=true
      - traefik.http.routers.traefik-prod.tls.certresolver=le
      - traefik.http.routers.traefik-prod.service=api@internal

  web:
    image: ${WEB_IMAGE}
    container_name: elikuren-web-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.web-prod.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.web-prod.entrypoints=websecure
      - traefik.http.routers.web-prod.tls=true
      - traefik.http.routers.web-prod.tls.certresolver=le
      - traefik.http.services.web-prod.loadbalancer.server.port=3000

  api:
    image: ${API_IMAGE}
    container_name: elikuren-api-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.api-prod.rule=Host(`${API_HOST}`)
      - traefik.http.routers.api-prod.entrypoints=websecure
      - traefik.http.routers.api-prod.tls=true
      - traefik.http.routers.api-prod.tls.certresolver=le
      - traefik.http.services.api-prod.loadbalancer.server.port=8000

networks:
  proxy:
    name: proxy
