services:
  db:
    image: postgres:16
    container_name: elikuren-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: elikuren
      POSTGRES_USER: elikuren
      POSTGRES_PASSWORD: change-me-prod
    volumes:
      - /opt/elikuren-data/postgres-prod:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elikuren -d elikuren"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    image: ${WEB_IMAGE}
    container_name: elikuren-web-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.web-prod.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.web-prod.entrypoints=websecure
      - traefik.http.routers.web-prod.tls=true
      - traefik.http.routers.web-prod.tls.certresolver=le
      - traefik.http.services.web-prod.loadbalancer.server.port=3000

  api:
    image: ${API_IMAGE}
    container_name: elikuren-api-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.api-prod.rule=Host(`${API_HOST}`)
      - traefik.http.routers.api-prod.entrypoints=websecure
      - traefik.http.routers.api-prod.tls=true
      - traefik.http.routers.api-prod.tls.certresolver=le
      - traefik.http.services.api-prod.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
