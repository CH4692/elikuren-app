api:
  dashboard: true

log:
  level: INFO

providers:
  docker:
    exposedByDefault: false
    network: proxy

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  le:
    acme:
      # E-Mail für LetsEncrypt – unbedingt anpassen
      email: change-me@example.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
