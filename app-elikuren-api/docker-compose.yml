services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: elikuren
      POSTGRES_USER: elikuren
      POSTGRES_PASSWORD: elikuren
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elikuren -d elikuren"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
