# Render Blueprint — create services after connecting the GitHub repo.
# Set secrets in the Render dashboard (do not commit real values).

services:
  - type: web
    name: elikuren-api
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: TRUSTED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

  - type: web
    name: elikuren-api-staging
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "true"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: TRUSTED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
