[project]
name = "elikuren-api"
version = "0.1.0"
description = "FastAPI backend for Kammerchor Elikuren"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=46.0.5",
    "fastapi>=0.135.2",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.12.1",
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    "svix>=1.89.0",
    "uvicorn[standard]>=0.42.0",
    "alembic>=1.16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
strict_optional = true
