name: deploy-dev

on:
  workflow_run:
    workflows:
      - build-web
      - build-api
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail

            mkdir -p /opt/elikuren-app/deploy

            if [ ! -f /opt/elikuren-app/deploy/.env.dev ]; then
              echo "Missing /opt/elikuren-app/deploy/.env.dev on server"
              exit 1
            fi

            cd /opt/elikuren-app
            chmod +x deploy/deploy.sh

            SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA=$(echo "$SHA" | cut -c1-7)
            WORKFLOW_NAME="${{ github.event.workflow_run.name }}"

            set -a
            . /opt/elikuren-app/deploy/.env.dev
            set +a

            CURRENT_WEB_IMAGE="${WEB_IMAGE}"
            CURRENT_API_IMAGE="${API_IMAGE}"

            if [ "$WORKFLOW_NAME" = "build-web" ]; then
              NEW_WEB_IMAGE="ghcr.io/ch4692/elikuren-web:git-${SHORT_SHA}"
              NEW_API_IMAGE="${CURRENT_API_IMAGE}"
            elif [ "$WORKFLOW_NAME" = "build-api" ]; then
              NEW_WEB_IMAGE="${CURRENT_WEB_IMAGE}"
              NEW_API_IMAGE="ghcr.io/ch4692/elikuren-api:git-${SHORT_SHA}"
            else
              echo "Unsupported workflow name: $WORKFLOW_NAME"
              exit 1
            fi

            ./deploy/deploy.sh dev "$NEW_WEB_IMAGE" "$NEW_API_IMAGE"
