# Fast PR/push checks — no Neon, no Playwright.
# E2E runs against Vercel Preview (see e2e-preview.yml).
name: web-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Build does not need a live DB; prisma generate runs in npm run build.
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?sslmode=disable
          DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:5432/build?sslmode=disable
          AUTH_SECRET: ci-build-auth-secret-not-for-runtime
