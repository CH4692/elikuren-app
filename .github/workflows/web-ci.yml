name: web-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Load Neon credentials into env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          VAR_DATABASE_URL: ${{ vars.DATABASE_URL }}
          VAR_DATABASE_URL_UNPOOLED: ${{ vars.DATABASE_URL_UNPOOLED }}
          VAR_AUTH_SECRET: ${{ vars.AUTH_SECRET }}
        run: |
          db="${DATABASE_URL:-${NEON_DATABASE_URL:-${VAR_DATABASE_URL}}}"
          db_direct="${DATABASE_URL_UNPOOLED:-${NEON_DATABASE_URL_UNPOOLED:-${VAR_DATABASE_URL_UNPOOLED:-$db}}}"
          auth="${AUTH_SECRET:-${NEXTAUTH_SECRET:-${VAR_AUTH_SECRET}}}"

          if [ -z "$db" ]; then
            echo "::error::Missing DATABASE_URL (set repository secret DATABASE_URL or NEON_DATABASE_URL)"
            exit 1
          fi
          if [ -z "$auth" ]; then
            echo "::error::Missing AUTH_SECRET (set repository secret AUTH_SECRET or NEXTAUTH_SECRET)"
            exit 1
          fi

          {
            echo "DATABASE_URL<<EOF"
            echo "$db"
            echo "EOF"
            echo "DATABASE_URL_UNPOOLED<<EOF"
            echo "$db_direct"
            echo "EOF"
            echo "AUTH_SECRET<<EOF"
            echo "$auth"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Use Playwright test defaults
        run: node scripts/write-ci-env.mjs

      - name: Migrate test database
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: UI tests
        run: npm run test:ui
