name: web-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Load Neon credentials into env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret DATABASE_URL"
            exit 1
          fi
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Missing repository secret DATABASE_URL_UNPOOLED"
            exit 1
          fi
          if [ -z "$AUTH_SECRET" ]; then
            echo "::error::Missing repository secret AUTH_SECRET"
            exit 1
          fi

          # Heredoc form keeps Neon query strings (&, =) intact across steps.
          {
            echo "DATABASE_URL<<EOF"
            echo "$DATABASE_URL"
            echo "EOF"
            echo "DATABASE_URL_UNPOOLED<<EOF"
            echo "$DATABASE_URL_UNPOOLED"
            echo "EOF"
            echo "AUTH_SECRET<<EOF"
            echo "$AUTH_SECRET"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Write .env.local for Prisma / Next / Playwright
        run: node scripts/write-ci-env.mjs

      - name: Migrate test database
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: UI tests
        run: npm run test:ui
