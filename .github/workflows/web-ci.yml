# Minimal CI — same shape as charles-portfolio:
# typecheck + lint → build → lightweight Playwright smoke (no Neon / no auth E2E).
name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  CI: true
  # Prisma generate / next build need placeholders; smoke tests hit public pages only.
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?sslmode=disable
  DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:5432/build?sslmode=disable
  AUTH_SECRET: ci-build-auth-secret-not-for-runtime
  SKIP_E2E_DB_SETUP: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck + Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build (Next)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: npx playwright test tests/smoke/routes.test.ts tests/pages/home.test.ts tests/pages/content.test.ts

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14
