name: web-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elikuren
          POSTGRES_PASSWORD: elikuren
          POSTGRES_DB: elikuren
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elikuren -d elikuren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Use test env
        run: cp .env.test .env.local

      - name: Migrate test database
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: UI tests
        run: npm run test:ui
